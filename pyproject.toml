[project]
name = "olg-bubble-lab"
version = "0.1.0"
description = "Check and visualize bubble-necessity frequency conditions in non-stationary OLG economies"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rin" }]
dependencies = [
    "click>=8.1",
    "matplotlib>=3.8",
]

[project.scripts]
olg-bubble = "olg_bubble_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olg_bubble_lab"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "--cov=olg_bubble_lab --cov-report=term-missing"
testpaths = ["tests"]
